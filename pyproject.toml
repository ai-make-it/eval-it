# Configurazione degli strumenti. Il progetto non e' un pacchetto: si
# esegue con "python src/run.py", non si installa.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    # Il codice qui e' scritto per essere letto da chi verifica il metodo,
    # non da un formattatore: le righe sono spezzate a mano dove aiuta.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# I test usano nomi lunghi e descrittivi al posto dei commenti.
"tests/*" = ["E501"]
