id: "057"
slug: controllo
termine: "Controllo"
settimana: 6
gruppo: "Sicurezza"
inglese:
  - "AI control"
cos_e: >-
  L'approccio che progetta difese partendo dal presupposto che il modello
  possa già perseguire obiettivi diversi da quelli previsti, e che quindi
  non ci si possa fidare di lui per la propria sicurezza.
perche_conta: >-
  È complementare all'allineamento e più immediatamente applicabile: non
  richiede di aver risolto il problema di rendere il modello affidabile,
  richiede di limitare cosa può fare se non lo è.
errore_comune: >-
  Contrapporlo all'allineamento come strategia alternativa. Sono strati
  diversi della stessa difesa, e un sistema serio li usa entrambi.
vedi_anche:
  - allineamento
  - scheming
  - capacita-pericolose
revisione: 1
