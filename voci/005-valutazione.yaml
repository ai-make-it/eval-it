id: "005"
slug: valutazione
termine: "Valutazione"
settimana: 1
gruppo: "Le fondamenta"
inglese:
  - "eval"
  - "evaluation"
cos_e: >-
  Il processo con cui si misura se un sistema fa quello che deve, su un
  insieme di casi scelti apposta e sempre gli stessi. Non è provarlo
  qualche volta e vedere se sembra andare.
perche_conta: >-
  È l'unica cosa che separa "abbiamo comprato l'AI" da "sappiamo cosa fa".
  Senza, ogni modifica al sistema è una scommessa e ogni miglioramento è
  un'impressione.
errore_comune: >-
  Costruirla dopo. Una valutazione scritta a valle tende a misurare
  proprio le cose che il sistema già fa bene, perché è da quelle che si è
  partiti per scriverla.
vedi_anche:
  - set-di-prova
  - metrica
  - benchmark
revisione: 1
