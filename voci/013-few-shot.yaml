id: "013"
slug: few-shot
termine: "Few-shot"
settimana: 2
gruppo: "Come si usa"
inglese:
  - "few-shot prompting"
cos_e: >-
  Mettere nel prompt alcuni esempi di input e output corretti, così che il
  modello capisca la forma della risposta attesa. Con zero esempi si parla
  di zero-shot.
perche_conta: >-
  Su compiti dal formato preciso è spesso il modo più rapido ed economico
  per migliorare i risultati, molto prima di pensare al fine-tuning.
errore_comune: >-
  Scegliere esempi tutti simili tra loro. Gli esempi definiscono
  implicitamente cosa il modello considera normale, e se coprono un solo
  caso il sistema si irrigidisce su quello.
vedi_anche:
  - prompt
  - fine-tuning
revisione: 1
