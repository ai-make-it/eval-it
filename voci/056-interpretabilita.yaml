id: "056"
slug: interpretabilita
termine: "Interpretabilità"
settimana: 6
gruppo: "Sicurezza"
inglese:
  - "interpretability"
  - "mechanistic interpretability"
cos_e: >-
  L'insieme delle tecniche che provano a capire cosa succede dentro un
  modello, invece di limitarsi a osservare cosa entra e cosa esce.
perche_conta: >-
  Se funzionasse in modo affidabile permetterebbe di rilevare
  comportamenti problematici prima che si manifestino, invece di scoprirli
  dai risultati.
errore_comune: >-
  Presentarla come prossima a risolvere il problema della fiducia nei
  modelli. Ricercatori di primo piano dello stesso campo hanno
  pubblicamente argomentato che non è ragionevole aspettarsi che individui
  in modo affidabile un modello ingannevole, e quelle critiche vanno lette
  insieme alle promesse.
vedi_anche:
  - allineamento
  - scheming
  - catena-di-ragionamento
revisione: 1
