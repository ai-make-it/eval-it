id: "016"
slug: rag
termine: "RAG"
settimana: 2
gruppo: "Come si usa"
inglese:
  - "retrieval-augmented generation"
cos_e: >-
  Recuperare i documenti pertinenti a una domanda e infilarli nel contesto
  prima che il modello risponda, così che risponda su quelli invece che a
  memoria.
perche_conta: >-
  È il modo standard per far lavorare un modello su informazioni che non
  aveva durante l'addestramento, dai documenti aziendali agli
  aggiornamenti recenti.
errore_comune: >-
  Pensare che risolva le allucinazioni. Le riduce quando il recupero
  funziona. Quando il recupero porta il documento sbagliato, il modello
  risponde con la stessa sicurezza su una fonte irrilevante.
vedi_anche:
  - ricerca-semantica
  - frammentazione
  - allucinazione
revisione: 1
