id: "022"
slug: uso-di-strumenti
termine: "Uso di strumenti"
settimana: 3
gruppo: "Architettura e agenti"
inglese:
  - "tool use"
  - "function calling"
cos_e: >-
  La capacità del modello di richiamare funzioni esterne, cercare sul web,
  interrogare un database, scrivere un file, e usarne il risultato nella
  risposta.
perche_conta: >-
  È quello che collega il modello al mondo. È anche il punto in cui un
  errore smette di essere una frase sbagliata e diventa un'azione
  sbagliata.
errore_comune: >-
  Dare accesso a strumenti potenti senza definire cosa succede quando il
  modello li usa male. Ogni strumento andrebbe pensato come se venisse
  invocato nel modo peggiore possibile, perché prima o poi succede.
vedi_anche:
  - agente
  - output-strutturato
  - prompt-injection
revisione: 1
