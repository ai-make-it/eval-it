id: "060"
slug: kill-chain
termine: "Kill chain"
settimana: 6
gruppo: "Sicurezza"
inglese:
  - "kill chain"
cos_e: >-
  Uno strumento preso dalla sicurezza informatica: si scompone uno
  scenario di minaccia negli stadi che dovrebbe attraversare per
  realizzarsi, dalla preparazione all'obiettivo finale.
perche_conta: >-
  Trasforma un rischio raccontato a parole in una catena di passaggi
  concreti, e permette di individuare il punto di strozzatura, l'anello
  che se viene spezzato fa cadere tutto il resto.
errore_comune: >-
  Fermarsi allo scenario. Lo scenario dice cosa potrebbe succedere, la
  kill chain dice come si svolgerebbe: solo la seconda indica dove
  conviene intervenire.
vedi_anche:
  - capacita-pericolose
  - red-teaming
revisione: 1
