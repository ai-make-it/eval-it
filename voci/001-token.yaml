id: "001"
slug: token
termine: "Token"
settimana: 1
gruppo: "Le fondamenta"
inglese:
  - "token"
cos_e: >-
  L'unità in cui un modello spezza il testo prima di elaborarlo. Non è una
  parola e non è una lettera, sta in mezzo.
perche_conta: >-
  Si paga a token, si misura a token, e tutti i limiti sono espressi in
  token. L'italiano ne consuma dal 15 al 30% in più dell'inglese per dire
  la stessa cosa, quindi lavorare nella propria lingua costa di più e
  porta prima al limite.
errore_comune: >-
  Contare le parole. "Cinquemila parole" non dice se si sta dentro il
  limite.
vedi_anche:
  - finestra-di-contesto
  - campionamento
revisione: 1
