id: "046"
slug: modello-giudice
termine: "Modello giudice"
settimana: 5
gruppo: "Come si verifica"
inglese:
  - "LLM-as-a-judge"
cos_e: >-
  Usare un modello linguistico per valutare gli output di un altro
  modello, secondo criteri scritti in un prompt di valutazione.
perche_conta: >-
  È l'unico modo pratico per valutare compiti aperti su volumi
  consistenti, dove non esiste una risposta unica corretta da confrontare.
errore_comune: >-
  Fidarsene senza averlo tarato su annotazione umana. Un giudice
  automatico ha bias propri, tende a premiare risposte lunghe e ben
  formattate, e va verificato su un campione etichettato a mano prima di
  essere messo in produzione.
vedi_anche:
  - annotazione
  - accordo-tra-annotatori
  - sicofanzia
revisione: 1
