id: "015"
slug: output-strutturato
termine: "Output strutturato"
settimana: 2
gruppo: "Come si usa"
inglese:
  - "structured output"
cos_e: >-
  Vincolare la risposta a una forma prestabilita, tipicamente uno schema
  JSON, invece di lasciarla in testo libero.
perche_conta: >-
  È quello che rende un modello utilizzabile dentro un software invece che
  solo davanti a una persona. Elimina un'intera classe di errori di
  interpretazione a valle.
errore_comune: >-
  Credere che un output valido sia un output corretto. Lo schema
  garantisce la forma, non il contenuto: un JSON perfettamente formato può
  contenere un dato inventato.
vedi_anche:
  - prompt
  - uso-di-strumenti
revisione: 1
