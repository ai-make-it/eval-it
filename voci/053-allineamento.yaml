id: "053"
slug: allineamento
termine: "Allineamento"
settimana: 6
gruppo: "Sicurezza"
inglese:
  - "alignment"
cos_e: >-
  Il problema di far sì che un sistema AI persegua effettivamente quello
  che chi lo ha costruito intendeva, e non un'approssimazione plausibile
  ottenuta ottimizzando la misura sbagliata.
perche_conta: >-
  È il problema di fondo del campo. Diventa più difficile, non più facile,
  man mano che i sistemi diventano capaci: un sistema più abile trova più
  modi di soddisfare il criterio senza soddisfare l'intenzione.
errore_comune: >-
  Ridurlo a una questione di filtri sui contenuti. Il filtro riguarda cosa
  il sistema dice, l'allineamento riguarda cosa persegue.
vedi_anche:
  - rlhf
  - constitutional-ai
  - controllo
revisione: 1
