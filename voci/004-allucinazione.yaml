id: "004"
slug: allucinazione
termine: "Allucinazione"
settimana: 1
gruppo: "Le fondamenta"
inglese:
  - "hallucination"
cos_e: >-
  Quando il modello produce un'affermazione falsa con la stessa sicurezza
  con cui ne produce una vera. Non sta mentendo e non si è rotto: sta
  facendo quello che fa sempre, cioè generare la continuazione più
  plausibile.
perche_conta: >-
  È una proprietà di come funziona, non un difetto in via di correzione. I
  sistemi migliorano nel ridurne la frequenza, non nell'eliminarla, e
  questo cambia il modo in cui vanno progettati i controlli attorno.
errore_comune: >-
  Trattarla come un bug da segnalare. Se il piano è "quando allucina lo
  segnaliamo", non è un piano.
vedi_anche:
  - rag
  - ground-truth
  - osservabilita
revisione: 1
