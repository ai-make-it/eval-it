id: "019"
slug: fine-tuning
termine: "Fine-tuning"
settimana: 2
gruppo: "Come si usa"
inglese:
  - "fine-tuning"
cos_e: >-
  Addestrare ulteriormente un modello già esistente su dati propri, per
  specializzarlo su un compito o su uno stile.
perche_conta: >-
  Serve quando il compito ha una forma molto specifica e ripetitiva, o
  quando si vuole ottenere da un modello piccolo il comportamento di uno
  grande, riducendo costi e latenza.
errore_comune: >-
  Usarlo per aggiungere conoscenza. Il fine-tuning insegna bene come
  rispondere, molto meno cosa sapere: per le informazioni serve il
  recupero, non l'addestramento.
vedi_anche:
  - post-addestramento
  - few-shot
  - modello-base-e-modello-istruito
revisione: 1
