termine: "Rifiuto eccessivo"
settimana: 4
gruppo: "Come sbaglia"
inglese:
  - "over-refusal"
cos_e: >-
  Quando il modello rifiuta richieste perfettamente legittime perché
  somigliano superficialmente a qualcosa di problematico.
perche_conta: >-
  È il costo dell'altro lato della sicurezza, e in ambiti come medicina,
  diritto e sicurezza sul lavoro rende i sistemi inutilizzabili proprio
  dove servirebbero di più.
errore_comune: >-
  Misurare solo i falsi permessi. Un sistema valutato unicamente su quanto
  blocca converge verso il rifiuto sistematico, che è sicurissimo e
  inservibile.
