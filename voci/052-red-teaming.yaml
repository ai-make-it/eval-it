id: "052"
slug: red-teaming
termine: "Red teaming"
settimana: 6
gruppo: "Sicurezza"
inglese:
  - "red teaming"
cos_e: >-
  Attaccare deliberatamente il proprio sistema per scoprire come si rompe,
  prima che lo scopra qualcun altro. Si fa a mano, in modo automatico, o
  entrambi.
perche_conta: >-
  La valutazione misura come si comporta il sistema con chi collabora. Il
  red teaming misura come si comporta con chi ha interesse a farlo
  sbagliare, che è la condizione reale di qualsiasi sistema esposto.
errore_comune: >-
  Farlo fare a chi ha costruito il sistema. Chi l'ha progettato attacca
  lungo le linee che ha già previsto, e le vulnerabilità stanno quasi
  sempre altrove.
vedi_anche:
  - jailbreak
  - capacita-pericolose
  - caso-limite
revisione: 1
