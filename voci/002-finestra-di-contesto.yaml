id: "002"
slug: finestra-di-contesto
termine: "Finestra di contesto"
settimana: 1
gruppo: "Le fondamenta"
inglese:
  - "context window"
cos_e: >-
  Quanto testo il modello riesce a tenere davanti agli occhi in una volta
  sola. Ci sta dentro tutto: le istruzioni, i documenti forniti, la
  conversazione fino a quel punto e la risposta che deve ancora scrivere.
perche_conta: >-
  Quando la si supera qualcosa viene tagliato, e non è chi usa il sistema
  a decidere cosa. È la causa più frequente dei comportamenti che gli
  utenti descrivono come "si è dimenticato quello che gli avevo detto".
errore_comune: >-
  Pensare che una finestra grande significhi che il modello usa bene tutto
  quello che c'è dentro. Le informazioni che stanno in mezzo a un contesto
  lungo vengono usate peggio di quelle all'inizio e alla fine.
vedi_anche:
  - token
  - rag
  - prompt-di-sistema
revisione: 1
