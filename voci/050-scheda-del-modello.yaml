id: "050"
slug: scheda-del-modello
termine: "Scheda del modello"
settimana: 5
gruppo: "Come si verifica"
inglese:
  - "model card"
  - "system card"
cos_e: >-
  Il documento con cui chi produce un modello ne descrive capacità,
  limiti, valutazioni svolte e comportamenti noti. Per i modelli di
  frontiera si chiama scheda di sistema ed è più ampia.
perche_conta: >-
  È la fonte primaria per capire cosa un fornitore dichiara e cosa ha
  effettivamente misurato. Chi valuta un sistema di terzi dovrebbe partire
  da lì invece che dal materiale commerciale.
errore_comune: >-
  Leggerla come una garanzia. Descrive prove svolte in condizioni scelte
  da chi vende, e l'assenza di un limite dichiarato non significa che quel
  limite non esista.
vedi_anche:
  - benchmark
  - capacita-pericolose
  - valutazione
revisione: 1
