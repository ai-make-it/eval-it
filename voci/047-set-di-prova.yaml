id: "047"
slug: set-di-prova
termine: "Set di prova"
settimana: 5
gruppo: "Come si verifica"
inglese:
  - "test set"
  - "eval set"
cos_e: >-
  L'insieme dei casi su cui si misura il sistema, fissato in anticipo e
  usato sempre uguale a ogni misurazione.
perche_conta: >-
  Se cambia a ogni giro, i risultati non sono confrontabili nel tempo e
  non si può sapere se una modifica ha migliorato o peggiorato le cose.
errore_comune: >-
  Costruirlo con i casi facili, quelli che si avevano sottomano. Un set di
  prova senza casi difficili produce risultati eccellenti e nessuna
  informazione utile.
vedi_anche:
  - valutazione
  - overfitting
  - ground-truth
revisione: 1
