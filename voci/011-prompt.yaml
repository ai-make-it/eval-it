id: "011"
slug: prompt
termine: "Prompt"
settimana: 2
gruppo: "Come si usa"
inglese:
  - "prompt"
cos_e: >-
  Tutto quello che viene dato al modello prima che risponda: l'istruzione,
  il contesto, gli esempi, i documenti. Non è solo la domanda che si
  scrive nella casella.
perche_conta: >-
  È l'unica leva che si controlla completamente senza toccare il modello,
  ed è quella dove si concentra la maggior parte dei miglioramenti reali
  nei sistemi in produzione.
errore_comune: >-
  Trattarlo come una formula magica da copiare. Un prompt che funziona
  benissimo su un modello può peggiorare le cose su un altro, e va
  rivalutato a ogni cambio di versione.
vedi_anche:
  - prompt-di-sistema
  - few-shot
  - dipendenza-dal-formato
revisione: 1
