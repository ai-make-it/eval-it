id: "032"
slug: bias
termine: "Bias"
settimana: 4
gruppo: "Come sbaglia"
inglese:
  - "bias"
cos_e: >-
  Distorsioni sistematiche nel comportamento del modello, ereditate dai
  dati di addestramento o introdotte dalle fasi successive. Sistematiche
  significa che si ripetono nella stessa direzione, non a caso.
perche_conta: >-
  Un errore casuale si compensa sui grandi numeri, un errore sistematico
  no: si accumula, e su decisioni che riguardano persone diventa un
  problema legale oltre che tecnico.
errore_comune: >-
  Cercarli solo dove ci si aspetta di trovarli. I bias che fanno danni nei
  sistemi aziendali sono spesso banali: preferenze per certi formati, per
  testi lunghi, per il primo elemento di un elenco.
vedi_anche:
  - annotazione
  - error-analysis
  - ground-truth
revisione: 1
