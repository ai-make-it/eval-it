id: "027"
slug: post-addestramento
termine: "Post-addestramento"
settimana: 3
gruppo: "Architettura e agenti"
inglese:
  - "post-training"
cos_e: >-
  Tutto quello che viene fatto dopo il pre-addestramento per rendere il
  modello utile e prevedibile: addestramento su istruzioni, apprendimento
  dal feedback umano, messa a punto della sicurezza.
perche_conta: >-
  È la fase che determina il carattere del modello, cosa accetta di fare,
  come formula le risposte, quanto insiste quando viene contraddetto. Due
  modelli con lo stesso pre-addestramento possono comportarsi in modi
  molto diversi.
errore_comune: >-
  Considerarlo un ritocco finale. È dove si decide gran parte di quello
  che gli utenti percepiscono come qualità.
vedi_anche:
  - pre-addestramento
  - rlhf
  - fine-tuning
revisione: 1
