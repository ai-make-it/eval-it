id: "020"
slug: modello-base-e-modello-istruito
termine: "Modello base e modello istruito"
settimana: 2
gruppo: "Come si usa"
inglese:
  - "base model"
  - "instruct model"
cos_e: >-
  Il modello base sa solo continuare il testo, perché è quello che ha
  imparato a fare. Il modello istruito ha ricevuto un addestramento
  successivo che gli insegna a seguire istruzioni e a comportarsi come un
  assistente.
perche_conta: >-
  Sono strumenti diversi. Quasi tutto quello che si usa quotidianamente è
  un modello istruito, ma per certi usi tecnici il modello base è più
  adatto perché è meno condizionato.
errore_comune: >-
  Provare un modello base aspettandosi che risponda a una domanda,
  concludere che è scadente. Sta facendo esattamente il suo lavoro:
  continuare quello che ha letto.
vedi_anche:
  - pre-addestramento
  - post-addestramento
  - fine-tuning
revisione: 1
