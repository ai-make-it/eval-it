id: "049"
slug: osservabilita
termine: "Osservabilità"
settimana: 5
gruppo: "Come si verifica"
inglese:
  - "observability"
cos_e: >-
  La strumentazione che permette di vedere cosa sta facendo davvero un
  sistema in produzione: cosa gli arriva, cosa risponde, quanto ci mette,
  dove si blocca.
perche_conta: >-
  La valutazione prima del rilascio dice come si comporta il sistema sui
  casi previsti. L'osservabilità dice come si comporta sui casi reali, che
  sono sempre diversi.
errore_comune: >-
  Registrare solo gli errori tecnici. In un sistema AI i fallimenti più
  costosi non generano nessuna eccezione: producono una risposta regolare
  e sbagliata, che senza registrazione del contenuto non si vede.
vedi_anche:
  - drift
  - fallimento-a-cascata
  - regressione
revisione: 1
