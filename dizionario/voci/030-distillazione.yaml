id: "030"
slug: distillazione
termine: "Distillazione"
settimana: 3
gruppo: "Architettura e agenti"
inglese:
  - "distillation"
cos_e: >-
  Addestrare un modello piccolo a riprodurre il comportamento di uno
  grande, usando le risposte del grande come materiale di insegnamento.
perche_conta: >-
  È il modo con cui si ottengono modelli veloci ed economici che su
  compiti specifici si avvicinano molto a quelli di frontiera.
errore_comune: >-
  Aspettarsi che il modello distillato tenga anche fuori dal perimetro su
  cui è stato distillato. Imita bene quello che ha visto, e degrada
  bruscamente appena si esce da lì.
vedi_anche:
  - parametri
  - quantizzazione
  - post-addestramento
revisione: 1
