id: "039"
slug: caso-limite
termine: "Caso limite"
settimana: 4
gruppo: "Come sbaglia"
inglese:
  - "edge case"
cos_e: >-
  Una situazione rara o ambigua in cui la regola generale del sistema non
  si applica in modo pulito. Il documento incompleto, la richiesta in due
  lingue, il modulo compilato male.
perche_conta: >-
  I sistemi AI sembrano funzionare benissimo finché si guardano i casi
  tipici. I casi limite sono pochi in percentuale e sono quasi sempre
  quelli che generano il reclamo, il danno o la notizia.
errore_comune: >-
  Trattarli come eccezioni da gestire dopo. Vanno elencati mentre si
  definisce il compito, perché sono la parte del compito che decide se il
  sistema è utilizzabile.
vedi_anche:
  - set-di-prova
  - error-analysis
  - red-teaming
revisione: 1
