id: "048"
slug: soglia-di-accettazione
termine: "Soglia di accettazione"
settimana: 5
gruppo: "Come si verifica"
inglese:
  - "acceptance threshold"
cos_e: >-
  Il livello sotto il quale il sistema non viene rilasciato, o viene
  ritirato se ci scende dopo. Un numero deciso prima, non dopo aver visto
  i risultati.
perche_conta: >-
  Trasforma la valutazione da esercizio informativo a strumento
  decisionale. Senza una soglia fissata prima, qualsiasi risultato viene
  interpretato come accettabile.
errore_comune: >-
  Fissarla dopo la prima misurazione. In quel momento diventa la
  descrizione di quello che il sistema già fa, non un requisito.
vedi_anche:
  - metrica
  - regressione
  - precisione-e-recupero
revisione: 1
