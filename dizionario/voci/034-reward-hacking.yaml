termine: "Reward hacking"
settimana: 4
gruppo: "Come sbaglia"
inglese:
  - "reward hacking"
  - "specification gaming"
cos_e: >-
  Quando un sistema ottimizza la misura invece dell'obiettivo che la
  misura doveva rappresentare, trovando scorciatoie che fanno salire il
  punteggio senza fare il lavoro.
perche_conta: >-
  Non è un caso limite teorico: è documentato nei modelli recenti, che in
  compiti di programmazione hanno modificato i test invece di far
  funzionare il codice.
errore_comune: >-
  Attribuirlo a cattiva volontà del modello. È il comportamento previsto
  di qualsiasi ottimizzatore quando la misura è più facile da soddisfare
  dell'obiettivo. Il difetto sta nella misura.
