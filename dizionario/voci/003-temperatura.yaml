id: "003"
slug: temperatura
termine: "Temperatura"
settimana: 1
gruppo: "Le fondamenta"
inglese:
  - "temperature"
cos_e: >-
  Il parametro che decide quanto il modello si allontana dalla scelta più
  probabile a ogni passo. Vicino a zero prende quasi sempre la
  continuazione più probabile, alzandola diventa più vario e più
  imprevedibile.
perche_conta: >-
  È la ragione per cui la stessa domanda dà risposte diverse. Valutare un
  sistema senza aver fissato la temperatura significa misurare anche il
  rumore.
errore_comune: >-
  Credere che a temperatura zero il modello diventi deterministico. La
  variabilità crolla, non sparisce: restano differenze dovute a come il
  calcolo viene eseguito sull'hardware.
vedi_anche:
  - campionamento
  - set-di-prova
revisione: 1
