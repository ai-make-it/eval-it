id: "007"
slug: benchmark
termine: "Benchmark"
settimana: 1
gruppo: "Le fondamenta"
inglese:
  - "benchmark"
cos_e: >-
  Un insieme standard di prove usato per confrontare modelli diversi sulla
  stessa base. Sono le tabelle che compaiono a ogni annuncio di un modello
  nuovo.
perche_conta: >-
  Servono a confrontare i modelli tra loro. Non servono a dire se un
  modello va bene per un caso specifico.
errore_comune: >-
  Scegliere il modello guardando la classifica. Il primo può essere
  peggiore del terzo sul caso concreto, e capita spesso.
vedi_anche:
  - valutazione
  - set-di-prova
  - overfitting
revisione: 1
