id: "033"
slug: overfitting
termine: "Overfitting"
settimana: 4
gruppo: "Come sbaglia"
inglese:
  - "overfitting"
cos_e: >-
  Quando un sistema si adatta così bene ai casi su cui è stato messo a
  punto da perdere colpi su tutto il resto. Ha imparato gli esempi invece
  della regola.
perche_conta: >-
  Nei sistemi basati su prompt succede senza che nessuno addestri niente:
  a forza di sistemare il prompt sui casi che fallivano, si costruisce
  qualcosa che funziona benissimo su quelli e peggio su tutti gli altri.
errore_comune: >-
  Usare per la messa a punto gli stessi casi con cui si misura il
  risultato. I due insiemi vanno tenuti separati e chiusi a chiave,
  altrimenti il numero finale non significa niente.
vedi_anche:
  - set-di-prova
  - benchmark
  - valutazione
revisione: 1
