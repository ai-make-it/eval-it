id: "043"
slug: accordo-tra-annotatori
termine: "Accordo tra annotatori"
settimana: 5
gruppo: "Come si verifica"
inglese:
  - "inter-annotator agreement"
cos_e: >-
  Quanto due persone che annotano lo stesso materiale, indipendentemente,
  arrivano alle stesse conclusioni.
perche_conta: >-
  È il tetto della valutazione. Se due esperti concordano solo nel 70% dei
  casi, nessuna misura automatica su quel compito può essere più
  affidabile di così, e i decimali oltre quella soglia sono rumore.
errore_comune: >-
  Non misurarlo affatto. È una mezza giornata di lavoro e determina se
  tutto quello che viene dopo ha senso.
vedi_anche:
  - annotazione
  - ground-truth
  - metrica
revisione: 1
